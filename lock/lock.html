<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfileLock | Locked</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <div class="background-effects">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="lock-container">
    <!-- Real-time Clock Widget -->
    <header class="clock-section">
      <div id="digitalClock" class="digital-clock">00:00:00</div>
      <div id="currentDate" class="current-date">Loading date...</div>
    </header>

    <!-- Glassmorphic Authentication Card -->
    <div class="auth-card" id="authCard">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="avatar-ring">
          <div class="avatar-icon" id="avatarDisplay">
            <!-- Default SVG Shield Icon -->
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M12 8v4M12 16h.01"/>
            </svg>
          </div>
        </div>
        <h1 id="profileName" class="profile-title">Personal Profile</h1>
        <p class="profile-subtitle">Enter your master password or PIN to unlock</p>
      </div>

      <!-- Main Unlock Form -->
      <form id="unlockForm" class="auth-form" autocomplete="off">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            type="password"
            id="passwordInput"
            placeholder="Master Password / PIN"
            required
            autofocus
            autocomplete="current-password"
            spellcheck="false"
          >
          <button type="button" id="togglePasswordVisibility" class="btn-icon" aria-label="Toggle password visibility">
            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- Cooldown / Error Banner -->
        <div id="statusMessage" class="status-message hidden"></div>

        <button type="submit" id="unlockButton" class="btn-primary">
          <span>Unlock Profile</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>

      <!-- Recovery Options Link -->
      <footer class="auth-footer">
        <button type="button" id="openRecoveryBtn" class="link-btn">Forgot Password / Recovery</button>
      </footer>
    </div>

    <!-- Recovery Modal -->
    <div id="recoveryModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Profile Recovery</h2>
          <button type="button" id="closeRecoveryBtn" class="modal-close-btn">&times;</button>
        </div>

        <div class="recovery-tabs">
          <button type="button" id="tabSecurityQ" class="tab-btn active">Security Question</button>
          <button type="button" id="tabEmergencyKey" class="tab-btn">Emergency Key</button>
        </div>

        <!-- Security Question Section -->
        <div id="sectionSecurityQ" class="recovery-section active">
          <p id="securityQuestionText" class="security-question-label">Loading question...</p>
          <input type="text" id="securityAnswerInput" placeholder="Your Answer" spellcheck="false" autocomplete="off">
          <input type="password" id="newPasswordInput" placeholder="New Master Password / PIN">
          <button type="button" id="submitSecurityRecoveryBtn" class="btn-primary">Verify & Reset Password</button>
        </div>

        <!-- Emergency Key Section -->
        <div id="sectionEmergencyKey" class="recovery-section hidden">
          <p class="recovery-desc">Enter your 20-character Emergency Recovery Key provided during setup:</p>
          <input type="text" id="emergencyKeyInput" placeholder="PLOCK-XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocomplete="off">
          <input type="password" id="emergencyNewPasswordInput" placeholder="New Master Password / PIN">
          <button type="button" id="submitEmergencyRecoveryBtn" class="btn-primary">Restore with Emergency Key</button>
        </div>

        <div id="recoveryStatus" class="status-message hidden"></div>
      </div>
    </div>
  </main>

  <script type="module" src="lock.js"></script>
</body>
</html>
